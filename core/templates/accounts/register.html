{% extends "base.html" %}


{% block content %}
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header text-center fs-3 ">Register</div>
                <div class="card-body">
                    <form action="." method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                id="id_username"
                                placeholder="example123"
                                required
                            />
                            
                            <small id="helpId" class="form-text text-danger"
                                    >{{form.errors.username}}</small
                             >
                            
                        </div>
                        <div class="mb-3">
                            <label for="id_password1" class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name="password1"
                                id="id_password1"
                                aria-describedby="helpId"
                                placeholder=""
                                required
                            />
                            
                        </div>
                        <div class="mb-3">
                            <label for="id_password2" class="form-label">Confirm Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name="password2"
                                id="id_password2"
                                aria-describedby="helpId"
                                placeholder=""
                                required
                            />
                            <small id="helpId" class="form-text text-danger"
                                    >{{form.errors.password2}}</small
                                    >{{form.errors.password1}}</small
                             >
                            
                        </div>

                        <div class="d-grid gap-2">
                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Submit
                            </button>
                        </div>
                        
                        
                    </form>
                </div>
                <div class="card-footer text-body-secondary fw-light fs-6 text-center">I have accounts ! <a href="{% url 'accounts:login-user' %}" class="link-primary">Login now</a></div>
            </div>
            
        </div>
    </div>
{% endblock content %}
